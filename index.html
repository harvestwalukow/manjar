.cipher-section,.how{scroll-margin-top:24px;max-width:1240px;margin:auto;padding:70px 28px 88px}.cipher-section{text-align:center}.cipher-section h2,.how h2{font-size:clamp(31px,4vw,42px);font-weight:540;letter-spacing:-.06em}.cipher-section>p{color:var(--muted);margin-top:8px}.cipher-tabs{margin:23px auto 29px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}.cipher-tabs button{border:1px solid var(--line);border-radius:999px;background:transparent;padding:7px 13px;cursor:pointer;font-size:13px}.cipher-tabs [aria-selected=true]{background:var(--ink);border-color:var(--ink);color:white}.cipher-gallery{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:12px}.cipher-gallery>*{border:0;border-radius:3px;background:var(--card);min-height:255px;text-align:left;padding:25px}.cipher-gallery article>span,.side-cipher span{display:flex;gap:7px;align-items:center;color:var(--amber);font-weight:630;font-size:13px}.cipher-gallery h3{font-size:clamp(25px,3vw,35px);margin:22px 0 8px;letter-spacing:-.04em}.cipher-gallery p,.how p{color:var(--muted);line-height:1.55}.cipher-gallery code{display:inline-block;margin-top:25px;padding:9px 12px;border-radius:4px;background:#e6ddd0;color:#57331c;font-size:14px}.side-cipher{cursor:pointer;opacity:.72}.side-cipher:hover{opacity:1}.side-cipher strong{display:block;margin-top:13px;font-size:21px}
.how{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.3fr;gap:30px}.how ol{margin:0;padding-left:24px}.how li{padding:15px 0 17px 10px;border-bottom:1px solid var(--line)}.how li:first-child{padding-top:0}.how strong{display:block;margin-bottom:5px}footer{background:var(--ink);display:flex;justify-content:space-between;padding:28px 5%;gap:15px}footer .wordmark{color:#f7dcc9}
@media(max-width:700px){.site-header{padding:10px 14px}.site-header nav>a:not(.play){display:none}.site-header .wordmark{font-size:18px}.hero{min-height:740px}.intro{padding-top:215px}.intro p{font-size:16px;max-width:330px}.hero-meta{gap:11px;flex-wrap:wrap}.diagrams img{max-width:30vw}.cipher-section,.how{padding:48px 16px}.cipher-gallery{grid-template-columns:1fr 1fr}.cipher-gallery article{grid-area:1/1/2/3}.side-cipher{min-height:100px;padding:16px}.how{grid-template-columns:1fr}.cipher-gallery>*{min-width:0}}
@media(prefers-reduced-motion:reduce){:root{scroll-behavior:auto}}
@media(min-width:701px){.intro h1{font-size:clamp(38px,4.2vw,48px)}}
