<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Game sandi klasik untuk dimainkan bersama di kelas.">
  <title>Operasi Sandi</title>
  <script>
// Ubah pesan di array LEVELS. Gunakan huruf A–Z dan spasi, 3–6 kata.
const SHOW_DECODER_TOOLS = true;

const LEVELS = [
  {
    type: "atbash",
    algorithm: "Atbash",
    title: "Pesan dari Bayangan",
    plaintext: "JANGAN LUPA ABSEN",
    story: "Agen di baris belakang menyelipkan catatan sebelum dosen menutup pintu kelas.",
    clue: "Alfabet dibalik.",
    method: "Cari pasangan huruf di alfabet terbalik. A berpasangan dengan Z, B dengan Y.",
    keyHint: "Atbash tanpa kunci. Mulai dari pola A ↔ Z, B ↔ Y, C ↔ X.",
    explanation: "Atbash memasangkan huruf pertama alfabet dengan huruf terakhir, lalu memasangkan huruf kedua dengan huruf sebelum terakhir. Terapkan aturan yang sama lagi untuk mengembalikan pesannya.",
    example: "KOPI",
  },
  {
    type: "caesar",
    algorithm: "Caesar Cipher",
    key: 3,
    showKey: true,
    title: "Operasi Kopi Pagi",
    plaintext: "KOPI MENYELAMATKAN NILAI KUIS",
    story: "Kurir kantin mengirim instruksi sebelum kuis mendadak. Untungnya, kunci tertulis di amplop.",
    clue: "Saat disandikan, setiap huruf maju tiga langkah.",
    method: "Untuk membaca pesan, geser setiap huruf tiga langkah mundur. Setelah A, lanjutkan dari Z.",
    explanation: "Caesar menggeser setiap huruf dengan jarak yang sama dan kembali ke A setelah Z. Karena kuncinya 3, dekripsi menggeser huruf tiga langkah ke arah sebaliknya.",
    example: "KUIS",
  },
  {
    type: "caesar",
    algorithm: "Caesar Cipher",
    key: 11,
    showKey: false,
    title: "Instruksi Tanpa Kunci",
    plaintext: "DOSEN JUGA BUTUH LIBUR",
    story: "Agen menghapus angka pergeseran sebelum meninggalkan ruang dosen. Temukan sendiri angka yang cocok.",
    clue: "Coba semua pergeseran dari 1 sampai 25 hingga muncul kalimat yang masuk akal.",
    method: "Pilih satu angka dan geser semua huruf mundur sebanyak angka itu. Ulangi dengan angka lain jika hasilnya belum terbaca.",
    explanation: "Semua huruf bergeser dengan jarak yang sama, tetapi kuncinya kali ini disembunyikan. Dengan mencoba 25 pergeseran nonnol, kamu bisa mencari kalimat yang masuk akal.",
    example: "AGEN",
  },
  {
    type: "scytale",
    algorithm: "Scytale",
    key: 5,
    title: "Pita di Ruang Arsip",
    plaintext: "TUGAS KELOMPOK DIKERJAKAN SENDIRI",
    story: "Di laci arsip ada pita pesan yang lepas dari silindernya. Susun kembali urutan hurufnya.",
    clue: "Gunakan grid sesuai jumlah kolom. Tabel menunjukkan urutan pengisian ciphertext.",
    method: "Isi grid dari atas ke bawah per kolom sesuai nomor pada sel. Baca hasilnya per baris dari kiri ke kanan.",
    explanation: "Versi Scytale ini menulis huruf pesan per baris pada grid berlebar tetap dan membacanya per kolom untuk membuat sandi. Untuk dekripsi, isi grid per kolom lalu baca per baris.",
    example: "KANTIN",
  },
  {
    type: "rail",
    algorithm: "Rail Fence Cipher",
    key: 3,
    title: "Jalur Zigzag",
    plaintext: "KELOMPOK KAMI CUMA PUNYA WACANA",
    story: "Sinyal agen melompat di antara tiga frekuensi. Ikuti jalurnya untuk menemukan pesan rapat.",
    clue: "Ikuti pola turun dan naik pada tiga rel.",
    method: "Isi titik dengan huruf sandi dari rel teratas ke terbawah, kiri ke kanan pada tiap rel. Baca huruf sesuai jalur zigzag.",
    explanation: "Rail Fence menulis huruf pesan turun dan naik di antara beberapa rel. Ciphertext diperoleh dengan membaca setiap rel dari kiri ke kanan, mulai dari rel paling atas.",
    example: "RAHASIA",
  },
  {
    type: "pigpen",
    algorithm: "Pigpen Cipher",
    title: "Kode dari Papan Tulis",
    plaintext: "PAPAN TULIS MENYIMPAN RAHASIA",
    story: "Seseorang menggambar lambang aneh di papan tulis sebelum bel berbunyi. Cocokkan bentuknya dengan alfabet.",
    clue: "Perhatikan bentuk garis dan apakah ada titik di dalamnya.",
    method: "Cocokkan setiap simbol dengan bentuk di tabel Pigpen. Simbol tanpa titik dan dengan titik mewakili huruf yang berbeda.",
    keyHint: "Gunakan tabel Pigpen di bagian referensi. Huruf A–R memakai kisi dan S–Z memakai bentuk silang.",
    explanation: "Pigpen mengganti setiap huruf dengan bentuk dari kisi atau bentuk silang. Titik membedakan dua kelompok huruf yang berbagi bentuk dasar yang sama.",
    example: "KODE",
  },
  {
    type: "vigenere",
    algorithm: "Vigenère Cipher",
    key: "BUKU",
    title: "Berkas Rahasia Terakhir",
    plaintext: "AGEN TERBAIK DUDUK PALING BELAKANG",
    story: "Berkas terakhir memakai kata kunci. Pecahkan teka-tekinya, lalu gunakan tabel untuk membaca pesan.",
    clue: "Aku punya halaman dan punggung, sering dibawa ke kelas, tapi tak bisa berjalan. Empat huruf, siapakah aku?",
    method: "Ulangi kata kunci di bawah huruf sandi tanpa menghitung spasi. Cari huruf sandi pada baris huruf kunci, lalu baca huruf di kepala kolom.",
    explanation: "Vigenère memilih besar pergeseran setiap huruf dari kata kunci yang diulang, dengan A bernilai 0 hingga Z bernilai 25. Pada tabula recta, baris adalah huruf kunci dan kolom adalah huruf asli.",
    example: "AGEN",
  },
];

const AZ = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const normalize = text => text.toUpperCase().trim().replace(/\s+/g, " ");
const lettersOnly = text => text.replace(/[^A-Z]/g, "");
const shiftLetter = (letter, shift) => AZ[(AZ.indexOf(letter) + shift + 26) % 26];

// Atbash memakai pemetaan yang sama ke kedua arah.
function encryptAtbash(text) {
  return text.replace(/[A-Z]/g, letter => AZ[25 - AZ.indexOf(letter)]);
}
function decryptAtbash(text) {
  return encryptAtbash(text);
}

// Caesar menggeser huruf dengan jarak tetap.
function encryptCaesar(text, shift) {
  return text.replace(/[A-Z]/g, letter => shiftLetter(letter, shift));
}
function decryptCaesar(text, shift) {
  return encryptCaesar(text, -shift);
}

// Scytale membaca indeks grid per kolom setelah pesan ditulis per baris.
function scytaleOrder(length, columns) {
  const order = [];
  for (let column = 0; column < columns; column++) {
    for (let index = column; index < length; index += columns) order.push(index);
  }
  return order;
}
function encryptScytale(text, columns) {
  return transpose(text, scytaleOrder(lettersOnly(text).length, columns));
}
function decryptScytale(text, columns) {
  return untranspose(text, scytaleOrder(lettersOnly(text).length, columns));
}

// Rail Fence berjalan bolak-balik antara rel atas dan bawah.
function railAt(index, rails) {
  const period = 2 * (rails - 1);
  const step = index % period;
  return Math.min(step, period - step);
}
function railOrder(length, rails) {
  const buckets = Array.from({ length: rails }, () => []);
  for (let index = 0; index < length; index++) buckets[railAt(index, rails)].push(index);
  return buckets.flat();
}
function encryptRailFence(text, rails) {
  return transpose(text, railOrder(lettersOnly(text).length, rails));
}
function decryptRailFence(text, rails) {
  return untranspose(text, railOrder(lettersOnly(text).length, rails));
}

// Spasi tetap di posisinya pada kedua sandi transposisi.
function transpose(text, order) {
  const letters = lettersOnly(text);
  let cursor = 0;
  return text.replace(/[A-Z]/g, () => letters[order[cursor++]]);
}
function untranspose(text, order) {
  const letters = lettersOnly(text);
  const restored = [];
  order.forEach((position, index) => { restored[position] = letters[index]; });
  let cursor = 0;
  return text.replace(/[A-Z]/g, () => restored[cursor++]);
}

// Token Pigpen menyimpan keluarga bentuk, posisi, dan tanda titik.
const pigpenGlyphs = [...AZ].map((_, index) => {
  if (index < 18) return "kisi-" + (index % 9) + "-" + Math.floor(index / 9);
  return "silang-" + ((index - 18) % 4) + "-" + Math.floor((index - 18) / 4);
});
function encryptPigpen(text) {
  return [...text].map(letter => letter === " " ? " " : pigpenGlyphs[AZ.indexOf(letter)]);
}
function decryptPigpen(tokens) {
  return tokens.map(token => token === " " ? " " : AZ[pigpenGlyphs.indexOf(token)]).join("");
}

// Vigenère mengulang kata kunci hanya saat menjumpai huruf.
function vigenereShift(text, key, direction) {
  let index = 0;
  return text.replace(/[A-Z]/g, letter => {
    const shift = AZ.indexOf(key[index++ % key.length]);
    return shiftLetter(letter, direction * shift);
  });
}
function encryptVigenere(text, key) {
  return vigenereShift(text, key, 1);
}
function decryptVigenere(text, key) {
  return vigenereShift(text, key, -1);
}

function codecFor(level) {
  switch (level.type) {
    case "atbash": return [encryptAtbash, decryptAtbash];
    case "caesar": return [text => encryptCaesar(text, level.key), text => decryptCaesar(text, level.key)];
    case "scytale": return [text => encryptScytale(text, level.key), text => decryptScytale(text, level.key)];
    case "rail": return [text => encryptRailFence(text, level.key), text => decryptRailFence(text, level.key)];
    case "pigpen": return [encryptPigpen, decryptPigpen];
    case "vigenere": return [text => encryptVigenere(text, level.key), text => decryptVigenere(text, level.key)];
    default: throw new Error("Jenis sandi tidak dikenal: " + level.type);
  }
}

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

const missions = LEVELS.map(level => {
  assert(/^[A-Z]+(?: [A-Z]+){2,5}$/.test(level.plaintext), "Periksa plaintext " + level.title);
  const [encrypt, decrypt] = codecFor(level);
  const ciphertext = encrypt(level.plaintext);
  for (const sample of [level.plaintext, level.example, AZ + " ABC", "A", ""]) {
    assert(decrypt(encrypt(sample)) === sample, "Self-test gagal: " + level.title);
  }
  console.info("Self-test lulus — " + level.title + " (" + level.algorithm + ")");
  return { ...level, ciphertext, encryptedExample: encrypt(level.example) };
});

assert(encryptAtbash("ABC XYZ") === "ZYX CBA", "Vektor Atbash gagal");
assert(encryptCaesar("XYZ", 3) === "ABC", "Vektor Caesar gagal");
assert(encryptScytale("ABCDEF", 4) === "AEBFCD", "Vektor Scytale gagal");
assert(encryptRailFence("WEAREDISCOVEREDFLEEATONCE", 3) === "WECRLTEERDSOEEFEAOCAIVDEN", "Vektor Rail Fence gagal");
assert(encryptPigpen("AJ S W").join("|") === "kisi-0-0|kisi-0-1| |silang-0-0| |silang-0-1", "Vektor Pigpen gagal");
assert(encryptVigenere("ATTACK AT DAWN", "LEMON") === "LXFOPV EF RNHR", "Vektor Vigenère gagal");
console.info("Self-test dan vektor acuan lengkap lulus.");


  </script>

/* Tata letak permainan. Warna dan komponen memakai token shadcn/ui. */
:root { color-scheme: light; }
body { min-width: 320px; }
.shell { width: min(100% - 48px, 1220px); margin-inline: auto; }
#app { display: flex; flex-direction: column; min-height: 100dvh; }
.main-content { flex: 1; padding-block: 32px 24px; }
.presenter-footer { display: flex; justify-content: flex-end; padding-bottom: 24px; }
.welcome-icon { display: grid; place-items: center; background: var(--primary); color: var(--primary-foreground); border-radius: var(--radius); }
[data-slot="card-title"] > svg, [data-slot="accordion-trigger"] span > svg { display: inline-block; width: 1em; height: 1em; vertical-align: -.13em; margin-right: .25em; }
[data-slot="card-description"] { line-height: 1.55; }
h1 { letter-spacing: -.045em; line-height: 1.06; }
#screen-heading:focus { outline: none; }

.welcome { display: grid; grid-template-columns: 1.5fr 1fr; align-items: stretch; gap: 20px; margin-top: clamp(20px, 7vh, 80px); }
.welcome-main { justify-content: center; min-height: 426px; }
.welcome-main [data-slot="card-header"], .welcome-main [data-slot="card-footer"] { padding-inline: clamp(24px, 4vw, 58px); }
.welcome-main h1 { font-size: clamp(3.5rem, 8vw, 7.25rem); }
.welcome-main [data-slot="card-description"] { font-size: clamp(1.05rem, 2vw, 1.25rem); max-width: 33ch; }
.welcome-main button { min-height: 44px; padding-inline: 24px; }
.welcome-icon { width: 46px; height: 46px; margin-bottom: 9px; }
.welcome-rules { justify-content: center; }
.welcome-rules [data-slot="card-header"], .welcome-rules [data-slot="card-content"] { padding-inline: clamp(24px, 3vw, 40px); }
.welcome-rules p { line-height: 1.6; color: var(--muted-foreground); }
.welcome-rules strong { color: var(--foreground); font-weight: 600; }
.welcome-rules svg { flex: none; width: 18px; margin-top: 3px; }

.mission-bar { display: flex; justify-content: space-between; align-items: center; gap: 28px; margin-bottom: 24px; }
.mission-progress { display: grid; gap: 8px; flex: 1; max-width: 660px; }
.level-steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.level-steps [data-slot="badge"] { width: 100%; min-height: 27px; font-variant-numeric: tabular-nums; }
.mission-stats { display: flex; gap: 20px; align-items: stretch; }
.mission-stats > div:not([data-slot="separator"]) { display: grid; gap: 3px; min-width: 97px; }
.mission-stats > [data-slot="separator"] { height: auto; }
.mission-stats span:has(> svg) { display: flex; align-items: center; gap: 5px; color: var(--muted-foreground); font-size: .875rem; }
.mission-stats svg { width: 15px; height: 15px; }
.mission-stats strong { font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.1; }
.mission-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(304px, 342px); gap: 18px; align-items: start; }
.mission-card h1, .results h1 { font-size: clamp(2rem, 4.1vw, 3.65rem); margin-block: 6px 2px; }
.mission-card [data-slot="card-description"] { font-size: 1rem; }
.cipher-panel { min-height: 192px; display: flex; flex-direction: column; gap: 20px; border: 1px solid var(--border); border-radius: var(--radius); padding: clamp(14px, 3vw, 25px); background: var(--muted); }
.cipher-label { display: flex; align-items: center; gap: 7px; color: var(--muted-foreground); font-size: .875rem; font-weight: 550; }
.cipher-label svg { width: 15px; height: 15px; }
.cipher-text { margin-block: auto; padding-block: 5px 12px; text-align: center; font-family: var(--font-mono); font-size: clamp(1.85rem, 4vw, 3.45rem); line-height: 1.16; letter-spacing: .025em; font-weight: 700; overflow-wrap: anywhere; }
.answer-row { display: flex; gap: 8px; }
.answer-row input { min-width: 0; height: 44px; font-size: 1rem; }
.answer-row button { min-height: 44px; }
.example-line { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }

.scytale-table, .tabula table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; font-size: .85rem; }
.scytale-table { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.scytale-table th, .scytale-table td { padding: 5px 6px; white-space: nowrap; }
.scytale-table td { font-family: var(--font-mono); border-top: 1px solid var(--border); }
.scytale-table th, .tabula th { background: var(--muted); font-weight: 600; }
.scytale-table :is(td, th) + :is(td, th) { border-left: 1px solid var(--border); }
.diagram { border: 1px solid var(--border); border-radius: var(--radius); padding: 7px; }
.diagram svg { display: block; width: 100%; }
.diagram text { fill: var(--foreground); font: 10px var(--font-mono); }
.diagram circle { fill: var(--background); stroke: var(--foreground); }
.rail-baseline { stroke: var(--border); stroke-dasharray: 4 4; }
.rail-track { fill: none; stroke: var(--muted-foreground); stroke-width: 1.5; }

.pigpen-words { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .35em .55em; }
.pigpen-word { display: inline-flex; justify-content: center; flex-wrap: wrap; gap: .055em; }
.pigpen-icon { width: .86em; height: .86em; flex: none; }
.pigpen-chart { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.pigpen-chart li { display: flex; min-width: 0; flex-direction: column; align-items: center; gap: 3px; border: 1px solid var(--border); border-radius: calc(var(--radius) / 2); padding-block: 5px; font-family: var(--font-mono); font-size: .75rem; }
.pigpen-chart .pigpen-icon { width: 23px; height: 23px; }
.decoder-glyphs { display: flex; flex-wrap: wrap; gap: 4px; }
.decoder-glyphs button svg.pigpen-icon { width: 22px; height: 22px; }
.example-line .pigpen-words { font-size: 1.5rem; }
.tabula { max-height: 282px; border: 1px solid var(--border); border-radius: var(--radius); }
.tabula :is(th, td) { min-width: 24px; height: 23px; font-family: var(--font-mono); border-bottom: 1px solid var(--border); }
.tabula thead th { position: sticky; top: 0; z-index: 1; }
.tabula th:first-child { position: sticky; left: 0; border-right: 1px solid var(--border); }
.tabula thead th:first-child { z-index: 2; }

.presenter-levels { display: flex; flex-wrap: wrap; gap: 6px; }
.results { max-width: 850px; margin-inline: auto; }
.result-score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; color: var(--muted-foreground); }
.result-score strong { font-size: clamp(2.4rem, 7vw, 4.8rem); line-height: 1; color: var(--foreground); letter-spacing: -.06em; }
.result-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding-block: 12px; }
.result-list li + li { border-top: 1px solid var(--border); }
.result-list p { margin-top: 3px; color: var(--muted-foreground); font-size: .875rem; line-height: 1.55; }
.confetti { position: absolute; z-index: 1; top: 22px; left: 50%; pointer-events: none; }
.confetti i { position: absolute; width: 8px; height: 5px; border-radius: 2px; animation: scatter 850ms ease-out both; }
@keyframes scatter {
  from { transform: translate(0, 0) rotate(0); opacity: 1; }
  75% { opacity: 1; }
  to { transform: translate(var(--x), var(--y)) rotate(var(--spin)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

@media (max-width: 850px) {
  .welcome, .mission-layout { grid-template-columns: minmax(0, 1fr); }
  .welcome { margin-top: 0; }
  .welcome-main { min-height: 310px; }
  .mission-stats { gap: 12px; }
}
@media (max-width: 560px) {
  .shell { width: calc(100% - 28px); }
  .main-content { padding-top: 18px; }
  .mission-bar { flex-direction: column-reverse; align-items: stretch; gap: 15px; margin-bottom: 16px; }
  .mission-stats { justify-content: space-between; }
  .mission-stats > div:not([data-slot="separator"]) { flex: 1; }
  .answer-row { flex-direction: column; }
  .result-list li { grid-template-columns: auto minmax(0, 1fr); }
  .result-list li > :last-child { grid-column: 2; }
}

</style>
</head>
