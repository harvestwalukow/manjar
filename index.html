.cipher-section,.how{scroll-margin-top:24px;max-width:1240px;margin:auto;padding:70px 28px 88px}.cipher-section{text-align:center}.cipher-section h2,.how h2{font-size:clamp(31px,4vw,42px);font-weight:540;letter-spacing:-.06em}.cipher-section>p{color:var(--muted);margin-top:8px}.cipher-tabs{margin:23px auto 29px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}.cipher-tabs button{border:1px solid var(--line);border-radius:999px;background:transparent;padding:7px 13px;cursor:pointer;font-size:13px}.cipher-tabs [aria-selected=true]{background:var(--amber);border-color:var(--amber);color:#21170c}.cipher-card>span{display:flex;gap:7px;align-items:center;color:var(--amber);font-weight:630;font-size:13px}.cipher-gallery h3{font-size:clamp(25px,3vw,35px);margin:22px 0 8px;letter-spacing:-.04em}.cipher-gallery p,.how p{color:var(--muted);line-height:1.55}.cipher-gallery code{display:inline-block;margin-top:25px;padding:9px 12px;border-radius:4px;background:#35271b;color:#ffe2aa;font-size:14px}
.how{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.3fr;gap:30px}.how ol{margin:0;padding-left:24px}.how li{padding:15px 0 17px 10px;border-bottom:1px solid var(--line)}.how li:first-child{padding-top:0}.how strong{display:block;margin-bottom:5px}footer{background:#100d0a;border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:28px 5%;gap:15px}footer .wordmark{color:#f7dcc9}
@media(max-width:700px){.site-header{padding:10px 14px}.site-header nav>a:not(.play){display:none}.site-header .wordmark{font-size:18px}.hero{min-height:740px}.intro{padding-top:215px}.intro p{font-size:16px;max-width:330px}.hero-meta{gap:11px;flex-wrap:wrap}.diagrams img{max-width:30vw}.cipher-section,.how{padding:48px 16px}.cipher-gallery{grid-template-columns:1fr 1fr}.how{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){:root{scroll-behavior:auto}}
@media(min-width:701px){.intro h1{font-size:clamp(38px,4.2vw,48px)}}
@media(max-width:700px){.diagrams img:nth-child(3),.diagrams img:nth-child(4){display:none}}

/* Match the reference carousel proportions against the Cipher Vault palette. */
.wordmark{font:650 22px Geist,Arial,sans-serif;letter-spacing:-.055em}
.diagrams img{transform:translate(-50%,-50%);max-width:17vw}
.cipher-section{max-width:1340px}
.cipher-section h2{font-weight:480}
.cipher-tabs{max-width:555px;gap:8px;margin-bottom:32px}
.cipher-tabs button{font-size:14px;padding:8px 16px}
.cipher-carousel{position:relative}
.cipher-gallery{--card-width:min(498px,44vw);--card-gap:24px;position:relative;display:block;overflow:hidden;touch-action:pan-y;cursor:grab;mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent)}
.cipher-gallery:active{cursor:grabbing}
.cipher-gallery>.cipher-track{position:relative;left:50%;display:flex;width:max-content;gap:var(--card-gap);min-height:0;padding:0;border:0;border-radius:0;background:none;text-align:left;transform:translate3d(calc(-1 * var(--position) * (var(--card-width) + var(--card-gap)) - var(--card-width) / 2 + var(--drag)),0,0);transition:transform .52s cubic-bezier(.23,1,.32,1);will-change:transform}
.cipher-track[data-instant=true]{transition:none}
.cipher-track>.cipher-card{display:flex;flex-direction:column;width:var(--card-width);min-height:520px;padding:32px;border:0;border-radius:5px;background:var(--card);text-align:left;grid-area:auto;user-select:none}
.cipher-card h3{font-size:clamp(21px,2vw,25px);font-weight:520;margin:41px 0 0;line-height:1.25}
.cipher-card-detail{margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}
.cipher-card-detail code{margin-top:18px}
.cipher-arrow{position:absolute;z-index:1;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--ink);cursor:pointer;opacity:0;transition:opacity .2s ease}
.cipher-arrow.previous{left:12px}.cipher-arrow.next{right:12px}
.cipher-carousel:hover .cipher-arrow,.cipher-carousel:focus-within .cipher-arrow{opacity:1}
.cipher-arrow:hover{border-color:var(--amber);color:var(--amber)}
@media(pointer:coarse){.cipher-arrow{opacity:1}}
@media(max-width:700px){
 .site-header .wordmark{font-size:18px}
 .diagrams img{max-width:24vw}
 .diagrams img:nth-child(1){left:22%!important;top:21%!important}
 .diagrams img:nth-child(2){left:79%!important;top:20%!important}
 .diagrams img:nth-child(5){left:25%!important;top:84%!important}
 .diagrams img:nth-child(6){left:75%!important;top:86%!important}
 .cipher-gallery{--card-width:calc(100vw - 72px);--card-gap:12px;mask-image:linear-gradient(to right,transparent,#000 3%,#000 97%,transparent)}
 .cipher-track>.cipher-card{min-height:370px;padding:22px}
 .cipher-card h3{margin-top:29px}
 .cipher-arrow.previous{left:-7px}.cipher-arrow.next{right:-7px}
}
@media(prefers-reduced-motion:reduce){.cipher-gallery>.cipher-track,.cipher-arrow{transition:none}}
